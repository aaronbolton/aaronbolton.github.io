<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaron Bolton</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #5a5a5f;
    --accent: #3b5bdb;
    --border: #e5e5e8;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101114;
      --card: #17181c;
      --text: #f2f2f3;
      --muted: #a0a0a6;
      --accent: #7c93ff;
      --border: #2a2b30;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 2rem 1rem;
  }

  main {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem;
  }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #9fb0ff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 600;
    color: #fff;
    margin-bottom: 1.5rem;
  }

  h1 {
    margin: 0 0 0.25rem;
    font-size: 1.75rem;
  }

  .role {
    margin: 0 0 1.25rem;
    color: var(--muted);
    font-size: 1rem;
  }

  p.bio {
    line-height: 1.6;
    color: var(--text);
    margin: 0 0 1.75rem;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
  }

  .links a {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-size: 0.9rem;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .links a:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  footer {
    margin-top: 2rem;
    font-size: 0.8rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <div class="avatar">AB</div>
  <h1>Aaron Bolton</h1>
  <p class="role">Software Engineer</p>
  <p class="bio">
    Welcome — this is my personal corner of the internet. I build things with code
    and occasionally write about it. Take a look around, or reach out using the
    links below.
  </p>
  <div class="links">
    <a href="https://github.com/aaronbolton" target="_blank" rel="noopener">GitHub</a>
    <a href="mailto:aaron@bukn.net">Email</a>
  </div>
  <footer>&copy; <span id="year"></span> Aaron Bolton</footer>
</main>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
